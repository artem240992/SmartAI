l_russian:
 # ============================================================
 # СОБЫТИЯ
 # ============================================================
 zz_smart_ai_seasonal.1.t: "Генерал Мороз"
 zz_smart_ai_seasonal.1.d: "Суровая русская зима всегда была нашим союзником. Наши солдаты привыкли к холоду, и их дух не сломить морозом."
 zz_smart_ai_seasonal.1.a: "Наши солдаты привыкли к холоду"

 zz_smart_ai_seasonal.2.t: "Русская зима"
 zz_smart_ai_seasonal.2.d: "Мы не были готовы к суровой русской зиме. Мороз сковывает наши войска, техника отказывает, а снабжение нарушено."
 zz_smart_ai_seasonal.2.a: "Зима будет суровой"

 zz_smart_ai_seasonal.3.t: "Сиси"
 zz_smart_ai_seasonal.3.d: "Финские солдаты — мастера зимней войны. Снег и мороз — наши союзники, а не враги."
 zz_smart_ai_seasonal.3.a: "Сиси — это не просто слово"

 zz_smart_ai_seasonal.4.t: "Зима близко"
 zz_smart_ai_seasonal.4.d: "Холода пришли на фронт. Наши войска вынуждены сражаться в тяжёлых погодных условиях."
 zz_smart_ai_seasonal.4.a: "Зима близко"

 zz_smart_ai_seasonal.5.t: "Африканская жара"
 zz_smart_ai_seasonal.5.d: "Итальянские солдаты привыкли к палящему солнцу Африки. Пустыня — наша стихия."
 zz_smart_ai_seasonal.5.a: "Наши солдаты знают, как сражаться в пустыне"

 zz_smart_ai_seasonal.7.t: "Муссоны"
 zz_smart_ai_seasonal.7.d: "Сезон дождей превратил дороги в болота. Наступление замедляется, а снабжение становится всё труднее."
 zz_smart_ai_seasonal.7.a: "Дожди замедляют наступление"

 zz_smart_ai_seasonal.8.t: "Летняя кампания"
 zz_smart_ai_seasonal.8.d: "Летняя жара испытывает наши войска на прочность. Но мы продолжим борьбу."
 zz_smart_ai_seasonal.8.a: "Летняя кампания продолжается"

 zz_smart_ai_seasonal.9.t: "Осенняя распутица"
 zz_smart_ai_seasonal.9.d: "Дожди превратили дороги в болота. Наши танки и моторизованные части увязают в грязи, темп наступления резко падает."
 zz_smart_ai_seasonal.9.a: "Грязь замедляет нас"

 zz_smart_ai_seasonal.10.t: "Весенняя распутица"
 zz_smart_ai_seasonal.10.d: "Таяние снегов и весенние дожди сделали дороги непроходимыми. Бронетанковые и моторизованные войска вынуждены сбавить ход."
 zz_smart_ai_seasonal.10.a: "Дороги раскисли"

 # ============================================================
 # ИДЕИ (Скриптовые эффекты)
 # ============================================================
 soviet_winter_counterattack: "Зимнее контрнаступление"
 soviet_winter_counterattack_desc: "Советские войска используют суровую зиму для контратаки против немецких захватчиков."

 soviet_winter_infantry_bonus: "Зимняя пехота"
 soviet_winter_infantry_bonus_desc: "Лыжные батальоны и сибирские дивизии, обученные войне в снегах, получают преимущество в передвижении и прорыве обороны."

 soviet_winter_war_bonus: "Бонус за Зимнюю войну"
 soviet_winter_war_bonus_desc: "Опыт, полученный в ходе Зимней войны, позволяет нашим войскам эффективнее действовать в сложных зимних условиях."

 # ============================================================
 # ДИНАМИЧЕСКИЕ МОДИФИКАТОРЫ (Погода и эффекты)
 # ============================================================
 russian_winter_bonus: "Русская зима"
 russian_winter_bonus_desc: "Наши солдаты привыкли к суровым морозам. Зима — наш союзник."

 german_winter_debuff: "Русская зима"
 german_winter_debuff_desc: "Мороз сковывает наши войска, техника отказывает, а снабжение нарушено. Мы не были готовы к такой зиме."

 finnish_winter_bonus: "Сиси"
 finnish_winter_bonus_desc: "Финские солдаты — мастера зимней войны. Снег и мороз помогают нам сражаться."

 harsh_winter: "Суровая зима"
 harsh_winter_desc: "Холода пришли на фронт. Наши войска вынуждены сражаться в тяжёлых погодных условиях."

 german_autumn_speed_penalty: "Осенняя распутица"
 german_autumn_speed_penalty_desc: "Дожди превратили дороги в болота. Танки и моторизованные части увязают в грязи, темп наступления резко падает."

 german_spring_speed_penalty: "Весенняя распутица"
 german_spring_speed_penalty_desc: "Таяние снегов и весенние дожди сделали дороги непроходимыми. Бронетанковые и моторизованные войска вынуждены сбавить ход."

 african_heat: "Африканская жара"
 african_heat_desc: "Палящее солнце изматывает наши войска. Техника перегревается, солдаты страдают от обезвоживания."

 italian_desert_bonus: "Пустынное мастерство"
 italian_desert_bonus_desc: "Итальянские солдаты привыкли к жаре и песку. Пустыня — наша стихия."

 monsoon_debuff: "Муссоны"
 monsoon_debuff_desc: "Сезон дождей превратил дороги в болота. Наступление замедляется, снабжение затруднено."