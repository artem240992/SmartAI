 COLD_WAR_BOOKMARK_NAME: "1 января, 1946 (В РАБОТЕ)"
 COLD_WAR_BOOKMARK_DESC: "Этот сценарий находится в разработке. Мы активно работаем над историей, границами и новыми механиками. Скоро грянет буря.\n\nТемные времена наступают. В Европе Гитлер укрепил свою власть, и его внимание все чаще привлекают страны по соседству с Германией. Италия под властью Муссолини вступает в рискованные военные авантюры, тогда как в Азии Японская империя уже готова напасть на Китай. Почти 20 лет минуло с окончания мировой войны, а мир опять пропах бензиновыми парами. Одной искры может оказаться достаточно."
 
